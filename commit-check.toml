# Git policy: https://commit-check.com/configuration/
# Commits follow Conventional Commits 1.0.0, branches follow Conventional Branch 1.1.0.

[commit]
# Same as the default; written out explicitly.
allow_commit_types = [
  "feat", "fix", "build", "chore", "ci", "docs", "perf", "refactor", "style", "test", "revert",
]
# Description in the imperative mood ("add", not "added").
subject_imperative = true

[branch]
conventional_branch = true
# The description after <type>/ follows the spec grammar strictly: [a-z0-9],
# dots inside a word, single hyphens between words.
require_description_grammar = true
# Branch types: only the spec's full names. Removed from the spec's list:
# the feat/fix aliases, the vendor prefixes claude, codex, copilot, cursor,
# and the ai prefix. The default is wider still: it also allows build, ci,
# docs, perf, refactor, test, style, agents, dependabot, renovate.
allow_branch_types = [
  "feature",
  "bugfix",
  "hotfix",
  "release",
  "chore",
]
